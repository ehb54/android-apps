# Single source of truth for versions. build-logic reads the SDK levels from here,
# and tools/docker-build.sh reads compileSdk and androidBuildTools for the Docker image.

[versions]
# minSdk 26 = Android 8.0. Keep it at 28 or below: the Galaxy S8+ test phone is
# stuck on Android 9 (API 28).
# compileSdk only decides which APIs code can call (current Compose needs 37).
# targetSdk opts in to newer runtime behavior; Google Play requires a minimum
# that rises every August (36 in 2026, presumably 37 in 2027). Keep it at the latest.
minSdk = "26"
compileSdk = "37"
targetSdk = "37"
# Build-tools baked into the Docker image; must match what AGP asks for.
androidBuildTools = "36.0.0"

agp = "9.5.0"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
exifinterface = "1.4.2"
kotlinxSerialization = "1.12.0"
junit = "4.13.2"
robolectric = "4.17"
# Compose's test library still pulls Espresso 3.5, which breaks on Android 17; pin newer.
androidxTestCore = "1.7.0"
espresso = "3.7.0"

# Desktop apps: JetBrains' Compose Multiplatform (Android apps keep Google's Compose above).
# Its Material 3 has its own version: the one each release lists in its notes
# (1.12.2 ships 1.12.0-alpha03, based on Material3 1.5.0-alpha22).
composeMultiplatform = "1.12.2"
composeMultiplatformMaterial3 = "1.12.0-alpha03"
coroutines = "1.11.0"
# @StringRes and friends, so screens copied from an Android app compile unchanged.
androidxAnnotation = "1.11.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# Desktop apps (Compose Multiplatform) and the plain-Kotlin modules they share with Android apps
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
jetbrains-compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
jetbrains-compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "composeMultiplatform" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }

# build-logic only
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Convention plugins from build-logic/
ehb54-android-application = { id = "ehb54.android.application" }
ehb54-android-library = { id = "ehb54.android.library" }
ehb54-jvm-library = { id = "ehb54.jvm.library" }
ehb54-desktop-library = { id = "ehb54.desktop.library" }
ehb54-desktop-application = { id = "ehb54.desktop.application" }
